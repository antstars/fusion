services:
  fusion:
    image: rook1e404/fusion:latest
    ports:
      - '12180:8080'
    environment:
      - PASSWORD=hellorss
    restart: "unless-stopped"
    container_name: fusion_rss
    volumes:
      - '/etc/timezone:/etc/timezone:ro'
      - '/etc/localtime:/etc/localtime:ro'
      - ./data:/data
      - '/etc/resolv.conf:/etc/resolv.conf:ro'
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 512M
    dns:
      - '192.168.2.6'